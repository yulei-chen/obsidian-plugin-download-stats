<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Plugin Download Stats</title>
<meta name="description" content="Chart the download history of any Obsidian community plugin, daily, weekly or monthly.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#">
      <span class="brand-mark"></span>
      Obsidian Plugin Downloads
    </a>
    <a class="source" href="https://github.com/obsidianmd/obsidian-releases/commits/master/community-plugin-stats.json" target="_blank" rel="noopener">Data source</a>
  </div>
</header>

<main class="wrap">
  <section class="search">
    <input id="query" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search by plugin ID, name or author — try dataview">
    <ul id="suggestions" class="suggestions" hidden></ul>
  </section>

  <section id="empty" class="empty">
    <p>Pick a plugin to see how its downloads have grown.</p>
    <div id="popular" class="chips"></div>
  </section>

  <section id="detail" hidden>
    <div class="plugin-head">
      <div>
        <h1 id="plugin-name"></h1>
        <p id="plugin-desc"></p>
        <p class="plugin-meta">
          <code id="plugin-id"></code>
          <span id="plugin-author"></span>
          <a id="plugin-repo" href="#" target="_blank" rel="noopener" hidden>GitHub</a>
        </p>
      </div>
    </div>

    <div class="cards">
      <div class="card"><span class="label">Total downloads</span><strong id="stat-total"></strong></div>
      <div class="card"><span class="label">Last 7 days</span><strong id="stat-7"></strong></div>
      <div class="card"><span class="label">Last 30 days</span><strong id="stat-30"></strong></div>
      <div class="card"><span class="label">Daily average (30d)</span><strong id="stat-avg"></strong></div>
    </div>

    <div class="controls">
      <div class="segmented" id="granularity">
        <button data-value="daily">Daily</button>
        <button data-value="weekly" class="active">Weekly</button>
        <button data-value="monthly">Monthly</button>
      </div>
      <div class="segmented" id="mode">
        <button data-value="delta" class="active">New</button>
        <button data-value="total">Cumulative</button>
      </div>
      <div class="segmented" id="range">
        <button data-value="90">90 days</button>
        <button data-value="365">1 year</button>
        <button data-value="0" class="active">All time</button>
      </div>
    </div>

    <div id="chart" class="chart"></div>
    <p id="notice" class="notice" hidden></p>
  </section>
</main>

<footer class="wrap footer">
  <span id="generated"></span>
  <span>Synced daily from obsidianmd/obsidian-releases</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
